<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#0B0D10"><title>Run It has moved</title>
<style>
  body { margin: 0; min-height: 100vh; background: #0B0D10; color: #F2F4F5; font: 16px/1.5 -apple-system, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
  main { max-width: 360px; padding: 32px 22px; }
  h1 { font: 700 40px/1 system-ui, sans-serif; letter-spacing: .04em; margin: 0 0 14px; }
  p { color: #B0B7BE; } b { color: #F2F4F5; }
  a.btn { display: block; text-align: center; background: #C6FF3D; color: #0B0D10; text-decoration: none; font-weight: 700; letter-spacing: .08em; border-radius: 14px; padding: 15px; margin: 22px 0; }
  ol { color: #B0B7BE; padding-left: 20px; }
</style>
<script>
  // In a normal browser tab, just go. A Home Screen web app is tied to this address, so it shows how to re-add it.
  var standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (!standalone) location.replace('https://run-it-app.github.io/app/' + location.search + location.hash);
</script></head><body><main>
<h1>RUN IT HAS MOVED</h1>
<p>Run It now lives at <b>run-it-app.github.io/app</b>. Your workouts are safe in Intervals.icu.</p>
<a class="btn" href="https://run-it-app.github.io/app/">OPEN THE NEW ADDRESS</a>
<ol>
  <li>Open it in <b>Safari</b>, tap <b>Share → Add to Home Screen</b>.</li>
  <li>Connect with Intervals.icu again (one tap).</li>
  <li>Remove this old Run It icon from your Home Screen.</li>
</ol>
</main></body></html>
