<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Run It has moved</title>
<script>
  // Old addresses under /run-it/… go to the same page on the new site; the old web app to its notice.
  var p = location.pathname;
  if (p.indexOf('/run-it/app/') === 0) location.replace('/run-it/app/');
  else location.replace('https://run-it-app.github.io' + (p.indexOf('/run-it/') === 0 ? p.slice(7) : '/') + location.search + location.hash);
</script></head><body><a href="https://run-it-app.github.io/">Run It</a></body></html>
